name: MaVie
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MaVie:
    type: application
    platform: iOS
    sources:
      - MaVie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayanerrr.mavie.capture
        INFOPLIST_FILE: MaVie/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
